<footer class="footer-container">
  <!-- Main Footer Content -->
  <div class="footer-content">
    <!-- Brand Section -->
    <div class="footer-brand">
      <div class="brand-logo">
        <mat-icon class="brand-icon">dashboard</mat-icon>
        <span class="brand-name">Dashboard</span>
      </div>
      <p class="brand-description">
        Building modern, scalable solutions with cutting-edge technology.
      </p>
      <!-- Social Links -->
      <div class="social-links">
        <button
          mat-icon-button
          *ngFor="let social of socialLinks"
          [title]="social.label"
          class="social-btn"
        >
          <mat-icon>{{ social.icon }}</mat-icon>
        </button>
      </div>
    </div>

    <!-- Footer Links Grid -->
    <div class="footer-links-grid">
      <div class="footer-section" *ngFor="let section of footerSections">
        <h4 class="section-title">{{ section.title }}</h4>
        <ul class="section-links">
          <li *ngFor="let link of section.links">
            <a [href]="link.url" class="footer-link">{{ link.label }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <mat-divider class="footer-divider"></mat-divider>

  <!-- Footer Bottom -->
  <div class="footer-bottom">
    <p class="copyright">
      &copy; {{ currentYear }} Dashboard. All rights reserved.
    </p>
    <div class="bottom-links">
      <a href="#" class="bottom-link">Privacy Policy</a>
      <span class="separator">•</span>
      <a href="#" class="bottom-link">Terms of Service</a>
      <span class="separator">•</span>
      <a href="#" class="bottom-link">Cookie Settings</a>
    </div>
  </div>
</footer>
